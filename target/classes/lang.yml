  toggle_off: "&c[CursorMenu] NPC创建已禁用"
  status_enabled: "&a[CursorMenu] NPC创建状态: 已启用"
  status_disabled: "&c[CursorMenu] NPC创建状态: 已禁用"
  reloaded: "&a[CursorMenu] NPC配置已重载"
  rotated: "&a[CursorMenu] NPC已旋转 %angle% 度"
